# Rendered to /etc/nginx/conf.d/default.conf by docker-entrypoint.sh, which
# substitutes __ACCESS_LOG__ from LOG_LEVEL. It ships in /etc/nginx/templates/
# so nginx never loads it with placeholders still in it.

# Files in conf.d are included inside http{}, which is where map must live.
# Lets the access_log below log only what went wrong: a 2xx/3xx is the uptime
# monitor doing its job, which nobody reads and which is pure SD-card churn at
# one request every few seconds.
map $status $status_failed {
    ~^[23]  0;
    default 1;
}

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Server-level directives override the http-level defaults inherited from the
    # base image, rather than adding a second destination alongside them.
    access_log __ACCESS_LOG__;

    # Deliberately never lowered past notice, not even at LOG_LEVEL=error: nginx
    # reports startup and shutdown at this level, and
    # "signal 3 (SIGQUIT) received, shutting down" is the line that distinguishes
    # an orderly stop from a crash. Quieting it would cost far more than it saves.
    error_log /dev/stderr __ERROR_LOG_LEVEL__;

    location / {
        try_files $uri /index.html;
    }

    # Probed by HEALTHCHECK every 30s and typically by an external monitor too.
    # Never access-logged at any level: at that rate it buries everything worth
    # reading. Point external monitors here rather than at / for the same reason.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite content-hashed bundles: safe to cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rewritten at container start (variables.sh) / per deployment: never cache long-term
    location = /variables-final.js {
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
