services:
  web:
    # Without this the container does not come back after a host reboot or a
    # Docker daemon restart: the daemon only restores containers that have a
    # restart policy.
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TIMER_BACKGROUND: ${TIMER_BACKGROUND}
      TIMER_TARGET: ${TIMER_TARGET}
      TIMER_TITLE: ${TIMER_TITLE}
      TIMER_DONE_MESSAGE: ${TIMER_DONE_MESSAGE}
      TIMER_DONE_COUNTUP: ${TIMER_DONE_COUNTUP}
      TIMER_DONE_ANIMATION: ${TIMER_DONE_ANIMATION}
      TIMER_DONE_HIDE_TIMER: ${TIMER_DONE_HIDE_TIMER}
      TIMER_DONE_RELOAD: ${TIMER_DONE_RELOAD}
      TIMER_DONE_REDIRECT_URL: ${TIMER_DONE_REDIRECT_URL}
      TIMER_DONE_DELAY_MS: ${TIMER_DONE_DELAY_MS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
