# Dependabot opens PRs to bump dependencies — including versions flagged by
# security advisories (works natively with pnpm-lock.yaml).
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # We deliberately track Node LTS only. Dependabot can't tell LTS from
      # current, so major bumps are reviewed and applied manually once a new
      # major goes Active LTS (see https://nodejs.org/en/about/previous-releases).
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
