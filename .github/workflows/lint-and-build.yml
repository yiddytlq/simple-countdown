name: Lint & Build Checks

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Which lint/build job to run'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - partial
      branch:
        description: 'Branch to run on'
        required: true
        default: 'main'
        type: string

jobs:
  pre-check:
    uses: ./.github/workflows/skip-copilot.yml

  partial-lint:
    name: Partial Lint (Changed Files)
    needs: pre-check
    if: needs.pre-check.outputs.skip != 'true' &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job_type == 'partial'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Upgrade npm to latest
        run: npm install -g npm@latest
      - name: Install dependencies (with timing)
        run: |
          echo "⏱️ Starting npm ci at $(date)"
          time npm ci
          echo "✅ Dependencies installed at $(date)"
      - name: Report build metrics
        run: |
          echo "📊 Build Performance Metrics:"
          echo "- Node.js version: $(node --version)"
          echo "- npm version: $(npm --version)"
          echo "- Cache location: $(npm config get cache)"
          if [ -d "$(npm config get cache)" ]; then
            echo "- Cache size: $(du -sh $(npm config get cache) | cut -f1)"
            echo "- Cache files: $(find $(npm config get cache) -type f | wc -l)"
          fi
          echo "- node_modules size: $(du -sh node_modules | cut -f1)"
      - name: Get changed JS/TS files
        id: changed_files
        run: |
          echo "::set-output name=files::$(git diff --name-only ${{ github.sha }}~1 ${{ github.sha }} | grep -E '\.(js|ts|tsx)$' || true)"
      - name: Run ESLint on changed files
        if: steps.changed_files.outputs.files != ''
        run: npx eslint ${{ steps.changed_files.outputs.files }}
      - name: Upload partial lint results
        uses: actions/upload-artifact@v4
        with:
          name: partial-lint-results
          path: eslint-report.txt

  full-lint-build:
    name: Full Lint & Build
    needs: pre-check
    if: needs.pre-check.outputs.skip != 'true' &&
        (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job_type == 'full'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Upgrade npm to latest
        run: npm install -g npm@latest
      - name: Install dependencies (with timing)
        run: |
          echo "⏱️ Starting npm ci at $(date)"
          time npm ci
          echo "✅ Dependencies installed at $(date)"
      - name: Report build metrics
        run: |
          echo "📊 Build Performance Metrics:"
          echo "- Node.js version: $(node --version)"
          echo "- npm version: $(npm --version)"
          echo "- Cache location: $(npm config get cache)"
          if [ -d "$(npm config get cache)" ]; then
            echo "- Cache size: $(du -sh $(npm config get cache) | cut -f1)"
            echo "- Cache files: $(find $(npm config get cache) -type f | wc -l)"
          fi
          echo "- node_modules size: $(du -sh node_modules | cut -f1)"
      - name: Run Full ESLint
        run: npm run lint
      - name: TypeScript Type Check
        run: |
          echo "⏱️ Starting TypeScript type check at $(date)"
          npx tsc --noEmit
          echo "✅ TypeScript type check completed at $(date)"
      - name: Build project (with timing)
        env:
          # Support both legacy TIMER_ and new VITE_ variables
          TIMER_BACKGROUND: ""
          TIMER_TARGET: "2025-12-31T23:59:59"
          TIMER_TITLE: "Test Build"
        run: |
          echo "⏱️ Starting build at $(date)"
          time npm run build
          echo "✅ Build completed at $(date)"
          echo "📁 Build output size: $(du -sh build | cut -f1)"
      - name: Upload full lint/build results
        uses: actions/upload-artifact@v4
        with:
          name: full-lint-build-results
          path: eslint-report.txt
