name: Slack Notifications

on:
  push:
    branches:
      - master
  pull_request:
    types: [reopened, closed]
  workflow_run:
    workflows:
      - Docker Build & Publish
      - CI
      - CodeQL Advanced
    types: [completed]
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Determine if workflow should notify
        id: decision
        run: |
          if [[ "${{ github.actor }}" == "yiddytlq" ]]; then
            echo "should_notify=false" >> $GITHUB_OUTPUT
            exit 0
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if [[ "${{ github.event.workflow_run.name }}" == "CodeQL Advanced" && "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
              echo "should_notify=false" >> $GITHUB_OUTPUT
            elif [[ "${{ github.event.workflow_run.name }}" == "CI" && "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
              echo "should_notify=false" >> $GITHUB_OUTPUT
            else
              echo "should_notify=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_notify=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine status emoji and color
        id: status_format
        run: |
          STATUS="${{ github.event.workflow_run.conclusion || job.status }}"
          case "$STATUS" in
            success)
              echo "emoji=:success:" >> $GITHUB_OUTPUT
              echo "color=#36a64f" >> $GITHUB_OUTPUT
              ;;
            failure)
              echo "emoji=:error:" >> $GITHUB_OUTPUT
              echo "color=#ff0000" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "emoji=:warn:" >> $GITHUB_OUTPUT
              echo "color=#ffae42" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Format event details as one line
        id: event_info
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_ACTION: ${{ github.event.action }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          WORKFLOW_NAME: ${{ github.event.workflow.name }}
        run: |
          DETAILS=""
          case "$EVENT" in
            push)
              COMMITS=$(echo "$COMMITS_JSON" | jq -r '.[].message')
              COMMITS=$(echo "$COMMITS" | tr '\n' ' | ' | sed 's/| $//; s/"/\\"/g')
              DETAILS="Commits pushed to \`$BRANCH\`: $COMMITS"
              ;;
            pull_request)
              DETAILS="Pull Request *$PR_ACTION*: \`$PR_TITLE\` (branch: \`$PR_BRANCH\`)"
              ;;
            issues)
              DETAILS="Issue *$ISSUE_ACTION*: \`#$ISSUE_NUMBER - $ISSUE_TITLE\`"
              ;;
            workflow_run)
              DETAILS="Workflow run triggered by *$WORKFLOW_NAME*"
              ;;
            *)
              DETAILS="$EVENT event triggered"
              ;;
          esac
          echo "details=$DETAILS" >> $GITHUB_OUTPUT

      - name: Send Slack Notification
        if: ${{ steps.decision.outputs.should_notify == 'true' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ steps.status_format.outputs.emoji }} *GitHub Action Notification*"
            attachments:
              - color: "${{ steps.status_format.outputs.color }}"
                blocks:
                  - type: section
                    text:
                      type: mrkdwn
                      text: |
                        *Event Details:* ${{ steps.event_info.outputs.details }}
                        *Repository:* <https://github.com/${{ github.repository }}|${{ github.repository }}>
                        *Workflow:* `${{ github.workflow }}`
                        *Status:* `${{ github.event.workflow_run.conclusion || job.status }}`
                        *Actor:* <https://github.com/${{ github.actor }}|${{ github.actor }}>
                        *URL:* <${{ github.event.pull_request.html_url || github.event.head_commit.url || github.event.workflow_run.html_url }}|View Details>
