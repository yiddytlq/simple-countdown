name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Run tests with coverage
        run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, appendFileSync } from 'node:fs';
          const out = process.env.GITHUB_STEP_SUMMARY;
          // Coverage floors are enforced by Vitest's coverage.thresholds (see vite.config.ts); the
          // test:coverage step above fails the job on a regression. This step only renders the table.
          let data;
          try {
            data = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'));
          } catch (err) {
            if (out) appendFileSync(out, `### Test coverage\n\nNo coverage summary found (${err.message}).\n`);
            process.exit(0);
          }
          const t = data.total;
          const row = (label, m) => `| ${label} | ${m.pct}% | ${m.covered}/${m.total} |`;
          const table = [
            '### Test coverage',
            '',
            '| Metric | % | Covered/Total |',
            '| --- | --- | --- |',
            row('Lines', t.lines),
            row('Statements', t.statements),
            row('Functions', t.functions),
            row('Branches', t.branches),
            '',
            '_Enforced floor: lines/statements 90%, functions/branches 85% (see vite.config.ts). Ratchet up over time._',
            '',
          ].join('\n');
          if (out) appendFileSync(out, table);
          EOF
      - run: pnpm build
        env:
          TIMER_BACKGROUND: ''
          TIMER_TARGET: '2030-01-01'
          TIMER_TITLE: 'CI'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # test:e2e builds every scenario variant (build-e2e/*) from its own TIMER_*
      # config, then runs the Playwright suite against the served builds.
      - name: Run Playwright E2E scenarios
        run: pnpm test:e2e

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      # No cache here: audit reads the lockfile only, so there is no pnpm store to save
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Audit dependencies (fails on high/critical)
        run: pnpm audit --audit-level high
