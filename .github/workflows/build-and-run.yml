name: Build and Run check

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the check on'
        required: true
        default: 'master'

permissions:
  contents: read

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.branch }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        env:
          TIMER_BACKGROUND: ''
          TIMER_TARGET: '2030-01-01'
          TIMER_TITLE: 'Smoke test'
        run: pnpm build

      - name: Serve build in background
        run: pnpm dlx serve -s build -l 3000 &

      - name: Wait for app to start
        run: pnpm dlx wait-on http://localhost:3000

      - name: Verify app is running
        run: curl -I http://localhost:3000
