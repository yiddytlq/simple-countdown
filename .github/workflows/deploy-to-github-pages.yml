name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy from'
        required: true
        default: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Upgrade npm to latest
        run: npm install -g npm@latest
      - name: Install dependencies (with timing)
        run: |
          echo "⏱️ Starting npm ci at $(date)"
          time npm ci
          echo "✅ Dependencies installed at $(date)"
      - name: Set variables and build
        env:
          TIMER_BACKGROUND: ${{ secrets.TIMER_BACKGROUND }}
          TIMER_TARGET: ${{ secrets.TIMER_TARGET }}
          TIMER_TITLE: ${{ secrets.TIMER_TITLE }}
          PUBLIC_URL: https://yiddytlq.github.io/simple-countdown
        run: |
          echo "⏱️ Starting TypeScript type check at $(date)"
          npx tsc --noEmit
          echo "✅ TypeScript type check completed at $(date)"
          ./variables.sh public
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4