name: Labeler

on:
  # Trigger labeler based on file paths & changes of status
  issues:
    types: [opened, edited, labeled]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # Track PR review submissions
  pull_request_review:
    types: [submitted]
  # Track PR merge or close for done:feature-branch labeling
  pull_request_target:
    types: [closed]

jobs:
  # File-based labeler
  file-labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

  # Dynamic status updater
  status-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Determine if the event is a PR review or PR closed
            let issueNumber;
            let eventType = context.eventName;

            const statusLabels = ["status:in-review", "status:changes-needed", "status:ready-to-merge", "status:done", "status:approval-needed", "status:info-needed", "done:feature-branch"];
            const labelsToAdd = [];
            const labelsToRemove = [];

            if (eventType === "pull_request_review") {
              issueNumber = context.payload.pull_request.number;
              const state = context.payload.review.state; // approved, changes_requested, commented

              // Decide which status to add
              if (state === "approved") {
                labelsToAdd.push("status:ready-to-merge");
                labelsToRemove.push("status:in-review", "status:changes-needed", "status:approval-needed");
              }
              if (state === "changes_requested") {
                labelsToAdd.push("status:changes-needed");
                labelsToRemove.push("status:in-review", "status:ready-to-merge");
              }
              if (state === "commented") {
                labelsToAdd.push("status:info-needed");
              }
            }

            if (eventType === "pull_request_target") {
              if (context.payload.pull_request.merged) {
                const targetBranch = context.payload.pull_request.base.ref;

                // Extract linked issue number from PR title, body, or commits
                const prTitle = context.payload.pull_request.title || '';
                const prBody = context.payload.pull_request.body || '';

                // Look for patterns like "Fixes #123", "Closes #456", etc.
                const issuePattern =
                  /(?:fix(?:es|ed)?|close(?:s|d)?|resolve(?:s|d)?)\s*#(\d+)/i;
                let linkedIssueMatch = prTitle.match(issuePattern) ||
                  prBody.match(issuePattern);

                if (linkedIssueMatch) {
                  issueNumber = parseInt(linkedIssueMatch[1]);

                  if (targetBranch === 'master') {
                    // When merged into master, set status:done and remove
                    // done:feature-branch
                    labelsToAdd.push("status:done");
                    labelsToRemove.push(...statusLabels.filter(l =>
                      l !== "status:done"));
                  } else {
                    // When merged into non-master branch, add
                    // done:feature-branch
                    labelsToAdd.push("done:feature-branch");
                    labelsToRemove.push("status:in-review",
                      "status:changes-needed", "status:approval-needed",
                      "status:info-needed");
                  }
                }
              }
            }

            if (eventType === "issues" && context.payload.action === "labeled") {
              // Optionally handle manual label updates if needed
              return;
            }

            if (issueNumber) {
              // Remove old status labels
              for (const label of labelsToRemove) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label
                }).catch(() => {});
              }

              // Add new status labels
              if (labelsToAdd.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: labelsToAdd
                });
              }
            }
