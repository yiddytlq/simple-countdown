# This file maps paths or patterns to labels
bug:
  - changed-files:
      - any-glob-to-any-file:
          - 'bug*'
          - '**/*.test.*'
feature:
  - changed-files:
      - any-glob-to-any-file: 'feature*'
enhancement:
  - changed-files:
      - any-glob-to-any-file: 'enhancement*'
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'
question:
  - changed-files:
      - any-glob-to-any-file: 'question*'
